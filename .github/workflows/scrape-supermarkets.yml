name: Weekly supermarket prices

# Thursday 23:00 UTC = Friday 02:00 in Nairobi, so weekend promos are in before shopping.
on:
  schedule:
    - cron: "0 23 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Scrape Quickmart (and Naivas, if it allows automated access)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-supermarkets.mjs
